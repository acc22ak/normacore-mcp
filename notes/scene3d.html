<style>

:root{--bg:#1d232c;--ink:#e9edf2;--mute:#94a0ae;--faint:#5d6876;--panel:rgba(29,35,44,.78);--line:rgba(233,237,242,.14);--near:#f2b566;--mid:#c98fb0;--far:#7d93f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;overflow:hidden}
canvas{display:block}
button{font:inherit}
button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
#hud{position:fixed;left:32px;top:28px;width:min(540px,42vw);pointer-events:none;text-shadow:0 1px 10px rgba(15,19,25,.95)}
#ask{font-size:15px;color:var(--mute);margin-bottom:14px}
#ask b{color:var(--ink);font-weight:500}
#call{font-weight:400;font-size:32px;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
#why{font-size:16px;line-height:1.5;margin-top:10px;max-width:50ch;color:var(--mute)}
#subs{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:16px}

#subs span.done{color:var(--mute)}
#subs span.on{color:var(--ink);border-bottom-color:var(--near)}
#guide{position:fixed;right:32px;top:28px;width:min(360px,29vw);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:14px 6px 8px}
#guide h3{margin:0 0 10px 12px;font-size:15px;font-weight:500;color:var(--mute)}
.row{display:grid;gap:1px;padding:8px 12px;border-left:1.5px solid transparent;transition:background .3s,border-color .3s}
.row .s{font-size:13.5px;color:var(--faint)}

.row.on{background:rgba(233,237,242,.06);border-left-color:var(--near)}

#log{position:fixed;left:32px;bottom:76px;width:min(540px,42vw);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:8px 12px;max-height:28vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:13.5px;line-height:1.45;pointer-events:none}

<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
// keep the pitch deck's arrow keys working when this page is embedded
addEventListener('keydown', e => { if (parent !== window && ['ArrowRight','ArrowLeft','PageDown','PageUp','n','N','f','F'].includes(e.key)) parent.postMessage({key: e.key}, '*'); });

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1d232c);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();

const view = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 10);
view.position.set(0.52, 0.62, 0.78);
const controls = new OrbitControls(view, renderer.domElement);
controls.target.set(0.2, 0.06, 0.0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 0.35; controls.maxDistance = 2.0;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x2a2622, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.6, 1.2, 0.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.6, right: 0.8, top: 0.6, bottom: -0.6, near: 0.1, far: 3 });
scene.add(sun);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: 0.05, ...o });
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const cyl = (r, h, mat, seg = 24) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat); m.castShadow = m.receiveShadow = true; return m; };

// table (robot frame: metres, base at origin, +x toward the depth camera, y up)
const table = box(1.3, 0.03, 0.9, M(0xc9995c, { roughness: 0.8 }));
table.position.set(0.32, -0.015, 0.0);
scene.add(table);
for (let i = -4; i <= 4; i++) { const s = box(1.3, 0.0004, 0.002, M(0xb5854b)); s.position.set(0.32, 0.0002, i * 0.1); s.castShadow = false; scene.add(s); }

// the box the figures go into
const BOX = { x: 0.2, z: -0.2, size: 0.14, h: 0.06, wall: 0.006 };
{
  const g = new THREE.Group(), mat = M(0x8b6a43, { roughness: 0.9 });
  const f = box(BOX.size, BOX.wall, BOX.size, mat); f.position.y = BOX.wall / 2; g.add(f);
  for (const [dx, dz, w, d] of [[0, BOX.size / 2, BOX.size, BOX.wall], [0, -BOX.size / 2, BOX.size, BOX.wall], [BOX.size / 2, 0, BOX.wall, BOX.size], [-BOX.size / 2, 0, BOX.wall, BOX.size]]) {
    const wl = box(w, BOX.h, d, mat); wl.position.set(dx, BOX.h / 2, dz); g.add(wl);
  }
  g.position.set(BOX.x, 0, BOX.z);
  scene.add(g);
}
const inBox = (x, z) => Math.abs(x - BOX.x) < BOX.size / 2 && Math.abs(z - BOX.z) < BOX.size / 2;

// a pen, for scale
{ const p = cyl(0.005, 0.14, M(0x1d6b3a), 12); p.rotation.z = Math.PI / 2; p.rotation.y = 0.5; p.position.set(0.33, 0.005, 0.0); scene.add(p); }

// ---------------------------------------------------------------- lego figures
function minifig(color, legs = 0x2d3a8c) {
  const g = new THREE.Group(), y = M(0xffd21f), c = M(color), l = M(legs);
  const legL = box(0.0075, 0.013, 0.008, l); legL.position.set(-0.004, 0.0065, 0); g.add(legL);
  const legR = legL.clone(); legR.position.x = 0.004; g.add(legR);
  const hip = box(0.016, 0.003, 0.008, l); hip.position.y = 0.0145; g.add(hip);
  const torso = box(0.016, 0.013, 0.008, c); torso.position.y = 0.0225; g.add(torso);
  for (const s of [-1, 1]) { const a = box(0.004, 0.011, 0.005, c); a.position.set(s * 0.0098, 0.022, 0.001); a.rotation.x = -0.3; g.add(a); const h = cyl(0.0022, 0.003, y, 10); h.position.set(s * 0.0098, 0.0155, 0.003); g.add(h); }
  const neck = cyl(0.003, 0.002, y, 12); neck.position.y = 0.03; g.add(neck);
  const head = cyl(0.0048, 0.0085, y); head.position.y = 0.0353; g.add(head);
  const stud = cyl(0.0028, 0.002, y, 12); stud.position.y = 0.0405; g.add(stud);
  return g;
}
const FIGS = [];
function addFig(id, color, legs, x, z, lying, yaw = 0) {
  const outer = new THREE.Group(), inner = minifig(color, legs);
  if (lying) { inner.rotation.x = -Math.PI / 2; inner.position.set(0, 0.0045, 0.0205); }
  outer.add(inner);
  outer.rotation.y = yaw;
  scene.add(outer);
  const f = { id, outer, home: [x, z], lying, yaw, top: lying ? 0.01 : 0.041, color, rest: 0, vy: 0, falling: false };
  FIGS.push(f);
  return f;
}
const fig1 = addFig(1, 0xd93a2b, 0x2d3a8c, 0.22, 0.10, false, 0.3);
const fig2 = addFig(2, 0x2f6fd6, 0x333333, 0.27, 0.15, false, -0.4);
const fig3 = addFig(3, 0x2fa35a, 0x6b4a2b, 0.16, 0.19, true, 0);
// lying figure across the radial direction, so the jaws need a wrist roll
fig3.yaw = Math.atan2(-0.19, 0.16);
function resetFigs() {
  for (const f of FIGS) {
    scene.attach(f.outer);
    f.outer.position.set(f.home[0], 0, f.home[1]);
    f.outer.rotation.set(0, f.yaw, 0);
    f.falling = false; f.vy = 0;
  }
}
resetFigs();

// ---------------------------------------------------------------- arm (simplified, analytic IK, jaws pointing down)
const H = 0.11, L1 = 0.17, L2 = 0.17, LW = 0.095;
const dark = M(0x1c1c1c, { roughness: 0.45 }), horn = M(0xff5a2a, { roughness: 0.5 }), steel = M(0x3a3a3a, { metalness: 0.4, roughness: 0.4 });
const base = new THREE.Group(); scene.add(base);
{ const b = cyl(0.05, 0.03, dark); b.position.y = 0.015; scene.add(b); const t = cyl(0.04, 0.05, dark); t.position.y = 0.055; base.add(t); const s = box(0.05, 0.045, 0.06, dark); s.position.y = H - 0.005; base.add(s); }
const upper = new THREE.Group(); upper.position.y = H; base.add(upper);
{ const a = box(L1, 0.03, 0.034, dark); a.position.x = L1 / 2; upper.add(a); for (const z of [-0.02, 0.02]) { const h = cyl(0.012, 0.004, horn); h.rotation.x = Math.PI / 2; h.position.z = z; upper.add(h); } }
const fore = new THREE.Group(); fore.position.x = L1; upper.add(fore);
{ const a = box(L2, 0.026, 0.03, dark); a.position.x = L2 / 2; fore.add(a); const s = box(0.04, 0.036, 0.04, dark); fore.add(s); for (const z of [-0.022, 0.022]) { const h = cyl(0.011, 0.004, horn); h.rotation.x = Math.PI / 2; h.position.z = z; fore.add(h); } }
const wrist = new THREE.Group(); wrist.position.x = L2; fore.add(wrist);
{ const s = box(0.034, 0.032, 0.036, dark); wrist.add(s); for (const z of [-0.02, 0.02]) { const h = cyl(0.01, 0.004, horn); h.rotation.x = Math.PI / 2; h.position.z = z; wrist.add(h); } }
const rollG = new THREE.Group(); wrist.add(rollG);
{ const palm = box(0.03, 0.03, 0.06, dark); palm.position.x = 0.038; rollG.add(palm); const cam = box(0.014, 0.012, 0.016, steel); cam.position.set(0.04, 0.02, 0); rollG.add(cam); }
const jawA = box(0.042, 0.012, 0.005, steel), jawB = jawA.clone();
jawA.position.x = jawB.position.x = LW - 0.021;
rollG.add(jawA, jawB);
function setGrip(gap) { jawA.position.z = gap / 2 + 0.0025; jawB.position.z = -gap / 2 - 0.0025; }

function ik(p) {
  const r = Math.hypot(p.x, p.z), th = Math.atan2(-p.z, p.x);
  const wr = r, wy = p.y + LW - H;
  let d = Math.hypot(wr, wy); d = Math.min(Math.max(d, 0.02), L1 + L2 - 1e-4);
  const a1 = Math.atan2(wy, wr) + Math.acos(Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
  const ex = L1 * Math.cos(a1), ey = L1 * Math.sin(a1);
  const a2 = Math.atan2(wy - ey, wr - ex);
  return { th, a1, a2 };
}
function poseArm(p, roll) {
  const q = ik(p);
  base.rotation.y = q.th; upper.rotation.z = q.a1; fore.rotation.z = q.a2 - q.a1; wrist.rotation.z = -Math.PI / 2 - q.a2;
  rollG.rotation.x = roll;
}
const tipWorld = () => rollG.localToWorld(new THREE.Vector3(LW, 0, 0));

// ---------------------------------------------------------------- depth camera, frustum, sight lines
const camPos = new THREE.Vector3(0.70, 0.59, 0.01);
const depthCam = new THREE.PerspectiveCamera(42, 640 / 480, 0.05, 3);
depthCam.position.copy(camPos);
depthCam.lookAt(camPos.clone().add(new THREE.Vector3(-Math.cos(0.75), -Math.sin(0.75), 0)));
depthCam.updateMatrixWorld(); depthCam.updateProjectionMatrix();
{ const body = box(0.09, 0.025, 0.025, M(0x9a9a9a, { metalness: 0.5, roughness: 0.35 })); body.position.copy(camPos); body.quaternion.copy(depthCam.quaternion); body.rotateY(Math.PI / 2); scene.add(body);
  const pole = cyl(0.006, camPos.y, steel); pole.position.set(camPos.x + 0.02, camPos.y / 2, camPos.z); scene.add(pole); }
const frustumMat = new THREE.LineBasicMaterial({ color: 0xe9edf2, transparent: true, opacity: 0.12 });
const frustumPts = [];
for (const [x, y] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { const v = new THREE.Vector3(x, y, 0.5).unproject(depthCam).sub(camPos).normalize().multiplyScalar(0.85).add(camPos); frustumPts.push(v); }
{ const pts = []; for (const v of frustumPts) pts.push(camPos, v); for (let i = 0; i < 4; i++) pts.push(frustumPts[i], frustumPts[(i + 1) % 4]); scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), frustumMat)); }
const coneMat = new THREE.MeshBasicMaterial({ color: 0xe9edf2, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
{ const g = new THREE.BufferGeometry(); const p = [camPos, ...frustumPts]; const idx = [0, 1, 2, 0, 2, 3, 0, 3, 4, 0, 4, 1];
  g.setFromPoints(p); g.setIndex(idx); const cone = new THREE.Mesh(g, coneMat); cone.userData.noPts = true; scene.add(cone); }
const sightMat = new THREE.LineDashedMaterial({ color: 0xe9edf2, dashSize: 0.008, gapSize: 0.006, transparent: true, opacity: 0 });
const sightGeo = new THREE.BufferGeometry().setFromPoints([camPos, camPos, camPos, camPos]);
const sight = new THREE.LineSegments(sightGeo, sightMat); scene.add(sight);
const pipCam = new THREE.PerspectiveCamera(13, 4 / 3, 0.05, 3);

// ---------------------------------------------------------------- point-cloud look: every surface drawn as the depth camera would see it
// Each mesh gets a cloud of points sampled from its surface, as a child, so moving parts carry their points.
// Colour = distance from the depth camera: warm near → rose → cool far. The solid meshes stay for clicking only.
const PT_VERT = `
uniform vec3 camPos; uniform float size; uniform float vpH;
varying float vT;
void main(){
  vec4 w = modelMatrix * vec4(position, 1.0);
  vT = clamp((distance(w.xyz, camPos) - 0.42) / 0.62, 0.0, 1.0);
  vec4 mv = viewMatrix * w;
  gl_Position = projectionMatrix * mv;
  gl_PointSize = max(1.0, size * projectionMatrix[1][1] * vpH * 0.5 / -mv.z);
}`;
const PT_FRAG = `
uniform float alpha; varying float vT;
vec3 ramp(float t){
  vec3 a = vec3(0.949,0.710,0.400), b = vec3(0.788,0.561,0.690), c = vec3(0.490,0.576,0.941);
  return t < 0.5 ? mix(a, b, t * 2.0) : mix(b, c, (t - 0.5) * 2.0);
}
void main(){
  vec2 p = gl_PointCoord - 0.5;
  if (dot(p, p) > 0.25) discard;
  gl_FragColor = vec4(ramp(vT), alpha);
}`;
const PT_MATS = [];
function pointMat(size, alpha) {
  const m = new THREE.ShaderMaterial({ vertexShader: PT_VERT, fragmentShader: PT_FRAG, transparent: alpha < 1, depthWrite: alpha >= 1,
    uniforms: { camPos: { value: camPos }, size: { value: size }, vpH: { value: innerHeight * renderer.getPixelRatio() }, alpha: { value: alpha } } });
  PT_MATS.push(m); return m;
}
const MAT_OBJ = pointMat(0.0021, 1), MAT_TABLE = pointMat(0.0024, 0.26);
const POINTS_PER_M2 = 170000;
function meshArea(g) {
  const p = g.attributes.position, a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(); let s = 0;
  for (let i = 0; i < p.count; i += 3) { a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2); s += b.sub(a).cross(c.sub(a)).length() / 2; }
  return s;
}
{
  const meshes = []; scene.traverse(o => { if (o.isMesh && !o.userData.noPts) meshes.push(o); });
  const v = new THREE.Vector3();
  for (const m of meshes) {
    if (m.geometry.parameters && m.geometry.parameters.height === 0.0004) { m.visible = false; continue; }   // table seams
    const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry;
    const isTable = m === table;

// ---------------------------------------------------------------- motor sound
// A recorded servo loop that plays the whole time; each frame the arm's real joint speed sets how loud and how
// high it sounds (same recipe as UI_LLM_experiments/25_robot_arm/motorSound.ts).
const MAX_GAIN = 0.5, RATE_MIN = 0.8, RATE_MAX = 1.25;
const JOINT_MAX_SPEED = 1.6;   // rad/s that counts as full speed in this scene
const GRIP_MAX_SPEED = 0.08;   // m/s of jaw travel that counts as full speed
const motor = { ctx: null, gain: null, source: null, level: 0, on: true, visible: true, prevQ: null, prevGrip: 0, skip: true };

  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC(), gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
  Object.assign(motor, { ctx, gain });
  const fromB64 = () => { if (!window.ROBOT_MOTOR_MP3) throw new Error('no sample'); const bin = atob(window.ROBOT_MOTOR_MP3); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; };

  (location.protocol === 'file:' ? Promise.resolve().then(fromB64) : fetch('assets/sounds/robot_motor.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject()).catch(fromB64))
    .then(data => ctx.decodeAudioData(data))
    .then(buffer => { const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true; src.connect(gain); src.start(); motor.source = src; })
    .catch(() => {});   // no sample: the arm is simply silent

  if (navigator.userActivation && navigator.userActivation.hasBeenActive) unlock();
}
function updateMotorSound(jointSpeeds, grip) {

  const target = Math.min(1, raw * 1.5);
  // quick to start, slower to die away, so frame-to-frame jitter doesn't flutter
  motor.level += (target - motor.level) * (target > motor.level ? 0.3 : 0.1);

  motor.gain.gain.setTargetAtTime(motor.level * MAX_GAIN, now, 0.05);

}
function motorFrame(dt) {

  if (motor.prevQ && !motor.skip && dt > 0) updateMotorSound(q.map((v, i) => Math.abs(v - motor.prevQ[i]) / dt / JOINT_MAX_SPEED), Math.abs(grip - motor.prevGrip) / dt / GRIP_MAX_SPEED);

}
startMotorSound();
// the pitch deck tells us when this slide is shown or hidden

  down = { x: e.clientX, y: e.clientY };
  if (mode !== 'try' || !idle() || held) return;
  const f = figUnder(e);
  if (f) { drag = { f, moved: false }; controls.enabled = false; }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode === 'try' && !drag) renderer.domElement.style.cursor = idle() && (held || figUnder(e)) ? 'pointer' : '';
  if (!drag) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) drag.moved = true;
  if (!drag.moved) return;
  const p = tableHit(e); if (!p) return;
  p.x = Math.max(-0.2, Math.min(0.9, p.x)); p.z = Math.max(-0.42, Math.min(0.42, p.z));
  drag.f.outer.position.set(p.x, floorOf(p.x, p.z), p.z);
});
renderer.domElement.addEventListener('pointerup', e => {
  const click = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) <= 5;
  controls.enabled = true;
  if (mode !== 'try') { drag = null; return; }
  if (drag) {
    const f = drag.f, moved = drag.moved; drag = null;
    if (moved) { labelsOn = true; addLog({ cls: 'call', t: `  (human moved figure ${f.id})` }); return; }
    const [x, z] = pos(f);
    if (!reachable(x, z)) { note(`find_objects(): figure ${f.id} reach.reachable = false`, 'Too far for the arm (it manages ~39 cm). Claude doesn\'t try: it asks the human to move it closer. Drag it back in.', { cls: 'bad', t: `  ✗ figure ${f.id}: out of reach → "could you move it closer?"` }); return; }
    const c = crowdedBy(f);
    if (c) { note(`find_objects(): figure ${f.id} crowded_by ${c.id}`, `Another figure sits within a jaw's width. Claude moves figure ${c.id} first, so the open jaws don't hit it. Click figure ${c.id}.`, { cls: 'bad', t: `  ✗ figure ${f.id} crowded_by ${c.id} (gap ${(Math.hypot(c.outer.position.x - x, c.outer.position.z - z) * 100).toFixed(1)} cm) → move ${c.id} first` }); return; }
    pickWithRecovery(f, missNext);
    if (missNext) { missNext = false; document.getElementById('miss').classList.remove('on'); }
    return;
  }
  if (click && idle() && held) {
    const p = tableHit(e); if (!p) return;
    if (!reachable(p.x, p.z)) { addLog({ cls: 'bad', t: '  ✗ that spot is out of reach: pick a closer one' }); return; }
    const other = FIGS.find(o => o !== held && Math.hypot(o.outer.position.x - p.x, o.outer.position.z - p.z) < 0.035);
    if (other) { addLog({ cls: 'bad', t: `  ✗ too close to figure ${other.id}: the open jaws would hit it` }); return; }
    place(held, p.x, p.z);
  }
});

// ---------------------------------------------------------------- buttons
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
document.getElementById('restart').onclick = () => reset();
document.getElementById('speed').onclick = e => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; e.target.textContent = speed + '×'; };
document.getElementById('find').onclick = () => { if (idle()) findObjects(); };
document.getElementById('home').onclick = () => { if (idle()) { if (held) { addLog({ cls: 'bad', t: '  put the figure down first' }); return; } goHome(); } };
document.getElementById('miss').onclick = e => { missNext = !missNext; e.currentTarget.classList.toggle('on', missNext); };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
document.getElementById('track').onclick = e => {
  if (mode !== 'tour') return;
  const r = e.currentTarget.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * endT);
};
function seek(target) {
  reset();
  while (idx + 1 < SEG.length && SEG[idx + 1].t0 <= target) { const s = SEG[++idx]; poseArm(s.to.tip, s.to.roll); scene.updateMatrixWorld(); enter(s); if (s.release) { s.release.outer.position.y = s.release.rest; s.release.falling = false; } }
  t = target; motor.skip = true;
};
document.getElementById('sound').onclick = e => { motor.on = !motor.on; e.target.textContent = motor.on ? 'Sound on' : 'Sound off'; if (motor.ctx && motor.visible) motor.ctx.resume(); };
addEventListener('resize', () => { for (const m of PT_MATS) m.uniforms.vpH.value = innerHeight * renderer.getPixelRatio(); view.aspect = innerWidth / innerHeight; view.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setMode(new URLSearchParams(location.search).get('mode') === 'try' ? 'try' : 'tour');
if (mode === 'tour' && new URLSearchParams(location.search).has('t')) seek(+new URLSearchParams(location.search).get('t'));
requestAnimationFrame(frame);
</script>
</body>
</html>
