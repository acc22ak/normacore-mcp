# ElRobot follower arm as wired on 2026-11-22. Sources:
#   live  = Station calibration read from bus 5B8E115950 (all ranges frozen)
#   urdf  = norma-core hardware/elrobot/simulation/elrobot_follower.urdf (radians, converted to deg)
#   probe = joint directions learned 2026-11-21 by nudging and watching the gripper cam
#
# Units: Station and the MCP server use normalized 0..1 inside each joint's calibrated range.
# ST3215 = 4096 steps / 360 deg. Every calibrated range here is centred on step 2048, so
#   deg = (raw - 2048) * 360/4096        norm = (raw - range_min) / span
# Assumption (unverified): step 2048 is the URDF zero.
# Hard limits for safety.py = the NARROWER of live and urdf (urdf is narrower on every joint).

arm: ElRobot follower (7 arm joints + 1 gripper, ST3215 12V servos, ~430 mm reach)
follower_bus: 5B8E115950        # the only bus code may command
leader_bus: 5B91043428          # never command (hand-guided, torque off)
ik: none                        # Station offers joint-space moves only; no IK found in norma-core
station: {host: localhost, tcp_port: 8888, web_ui: 8889}

joints:
  #  id  name            live range (raw)  live span  urdf limits (deg)   deg per 0.01 norm
  base_yaw:       {id: 1, raw: [1025, 3071], span_deg: 179.8, urdf_deg: [-88.9,   88.9],  deg_per_0_01: 1.80, plus: "turns the arm to its left (gripper cam pans left)"}
  shoulder:       {id: 2, raw: [ 947, 3149], span_deg: 193.5, urdf_deg: [-92.4,   92.4],  deg_per_0_01: 1.94, plus: "leans forward/down toward the desk; near 0 = fully up/back"}
  upper_arm_roll: {id: 3, raw: [ 881, 3215], span_deg: 205.1, urdf_deg: [-100.9, 100.9],  deg_per_0_01: 2.05, plus: "tilts the view down / brings the camera closer to the desk"}
  elbow:          {id: 4, raw: [ 887, 3209], span_deg: 204.1, urdf_deg: [-100.5, 100.5],  deg_per_0_01: 2.04, plus: "lowers toward the desk (minus lifts / looks up)"}
  forearm_roll:   {id: 5, raw: [  53, 4043], span_deg: 350.7, urdf_deg: [-150.1, 186.3],  deg_per_0_01: 3.51, plus: "pans the view right with slight tilt"}
  wrist_pitch:    {id: 6, raw: [1007, 3089], span_deg: 183.0, urdf_deg: [-78.9,  101.1],  deg_per_0_01: 1.83, plus: "tilts the camera down"}
  wrist_roll:     {id: 7, raw: [ 101, 3995], span_deg: 342.2, urdf_deg: [-183.4, 156.6], deg_per_0_01: 3.42, plus: "rotates clockwise (0.51 = camera upright)"}
  gripper:        {id: 8, raw: [1267, 2829], span_deg: 137.3, urdf_deg: [0, 126.2],       deg_per_0_01: 1.37, plus: "opens (0.01 fingers touching, 0.36 narrow gap, 0.5 half, 0.65 wide, ~0.92 max)"}

# Suggested jog set for Claude (rolls 3 and 5 are hard to describe in words; leave them out):
jog_joints: [base_yaw, shoulder, elbow, wrist_pitch, wrist_roll]
jog_max_deg: 30                 # = 0.15-0.17 norm on base/shoulder/elbow/wrist_pitch, ~0.09 on wrist_roll

# Measured hazards (2026-11-21)
hazards:
  - "shoulder > ~0.9 with low elbow presses the jaws into the desk (current ~22 = contact)"
  - "elbow below ~0.06 stalls (current spikes to 16)"
  - "open laptop + cables right of the base: keep low moves away from base_yaw < ~0.4"
  - "shoulder and elbow sag a little under gravity; verify with joint feedback, tolerance not tuned"

# Demo soft limits (normalized), applied on top of the URDF limits. Chosen from the hazards above
# and yesterday's working poses; widen only after checking on the arm. Joints not listed: URDF only.
# Extra limits on top of each joint's calibrated range (0..1). OFF for now (user, 2026-11-22):
# the URDF limits and the soft limits below were assumptions that cut off real hand-demonstrated
# movements. With this false, a joint may use its whole calibrated range.
use_extra_limits: false

soft_limits:
  base_yaw:    [0.30, 0.75]     # keeps clear of the laptop on the right
  shoulder:    [0.00, 0.60]     # well short of desk contact (~0.9)
  elbow:       [0.10, 1.00]     # elbow stalls below ~0.06
  wrist_pitch: [0.30, 0.80]
  wrist_roll:  [0.20, 0.85]

# Poses live in config/poses.yaml.

cameras:                        # roles saved in ~/normacore-mcp/data/cameras.json
  desk:    {camera_id: "32e6:9228:202604081837", frame: "853x480", view: "down the table from the far end"}
  gripper: {camera_id: "32e6:9251:2025090142113", frame: "320x240", view: "between the jaws"}
